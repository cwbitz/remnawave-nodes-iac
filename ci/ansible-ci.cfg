# CI-only Ansible config, selected via ANSIBLE_CONFIG in .github/workflows/ci.yml.
# Uses a vault-free inventory so lint/syntax-check run without encrypted
# host_vars. Omits vault_password_file on purpose (no vault password exists in
# CI). Relative paths resolve against ci/.
[defaults]
inventory               = ./inventory.yml
roles_path              = ../roles
collections_path        = ../collections
home                    = ../.cache/ansible
retry_files_enabled     = False
nocows                  = True
interpreter_python      = auto_silent

[inventory]
unparsed_is_failed      = True
