---
# ==============================================================================
# Deploy a Remnawave proxy Node.
#
#   make deploy
#
# A Remnawave Node is a lightweight container that embeds Xray-core; it is
# managed by the Remnawave Panel (which lives in the sibling docker-stack-iac
# project) and dialable by it on NODE_PORT. Each node also joins the NetBird
# overlay and carries host monitoring/security (roles/monitoring, which includes
# roles/agent) before the Remnawave Node container is deployed (roles/remnanode).
#
# Driven from the control node over SSH. See README.md and docs/components/.
# ==============================================================================

# Preflight on the control node: every managed host's connection address lives in
# the gitignored inventory (the committed template carries the CHANGE_ME_HOST_IP
# placeholder). It is validated here, as an implicit localhost play and before
# any connection is attempted, so an unfilled entry fails with the command that
# fixes it instead of an opaque SSH-resolution error. Tagged [always], so focused
# runs check it too.
- name: "Preflight: verify the managed hosts are configured"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: "[Preflight] Require a real management address for every host"
      ansible.builtin.assert:
        that:
          - (hostvars[item].ansible_host | default('', true) | string | trim | length) > 0
          - >-
            (hostvars[item].ansible_host | default('', true) | string | trim)
            is not match('(?i)^(change_?me|todo)')
        fail_msg: |-
          { item }: ansible_host is
          '{ hostvars[item].ansible_host | default('<unset>', true) }', which is not a
          usable management address. Set the real address in the gitignored
          inventory/hosts.yml, or re-scaffold the host:
            make host-init HOST={{ item }} HOST_IP=<management-ip>
        quiet: true
      loop: "{{ groups['remnanodes'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

- name: Preflight
  hosts: remnanodes
  gather_facts: false
  run_once: true
  tasks:
    - name: "[Preflight] Assert a supported ansible-core engine on the control node"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(ansible_core_min_version | default('2.19.0'), '>=')
          - (ansible_version.full is version(ansible_core_max_version | default('2.20.0'), '<')) or (ansible_core_allow_untested | default(false) | bool)
        fail_msg: >-
          ansible-core {{ ansible_version.full }} is outside the supported range
          [{{ ansible_core_min_version | default('2.19.0') }},
          {{ ansible_core_max_version | default('2.20.0') }}). Install the pinned
          toolchain (mise install / make install) or, if you knowingly
          accept an untested newer engine, set ansible_core_allow_untested=true.
      delegate_to: localhost
      become: false

    - name: "[Preflight] Require the service account (not root) for the deploy"
      ansible.builtin.assert:
        that:
          - (ssh_user | default('root')) != 'root' or (allow_root_login | default(false) | bool)
        fail_msg: >-
          The deploy must run as the non-root `ansible` service account, not
          root. Run `make host-bootstrap` once as root to create it, then set its
          key/password in inventory/host_vars/<host>/vault.yml. Override
          deliberately with allow_root_login=true if you accept running as
          root.

- name: Deploy the Remnawave node stack
  hosts: remnanodes
  gather_facts: true
  roles:
    # Host monitoring + security; includes the NetBird overlay agent.
    - role: monitoring
      tags: [monitoring]
      when: monitoring_enabled | default(false) | bool
    # Default-deny inbound firewall (a dedicated nftables table): keeps NODE_PORT
    # and everything else off the public internet while the overlay stays open.
    - role: firewall
      tags: [firewall]
      when: firewall_enabled | default(false) | bool
    # The Remnawave Node container itself.
    - role: remnanode
      tags: [remnanode]
