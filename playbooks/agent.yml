---
# ==============================================================================
# Join the Remnawave Nodes to the NetBird overlay (agent only).
#
#   make agent
#
# Runs the NetBird agent on the `remnanodes` group so each host becomes a
# mesh peer; a routing node (netbird_agent_routing: true) additionally has IP
# forwarding enabled. The setup key (peer_setup_key) decides the group a peer
# auto-joins, hence its role in the mesh. Both inputs are owned by this project
# (see host_vars main.yml and the vault). See roles/agent.
# ==============================================================================

- name: Join the Remnawave nodes to the NetBird overlay
  hosts: remnanodes
  gather_facts: true
  roles:
    - role: agent
