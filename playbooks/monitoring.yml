---
- name: Join the Remnawave nodes to the NetBird overlay
  hosts: remnanodes
  gather_facts: true
  roles:
    - role: agent
      when: netbird_enabled | default(true) | bool
  tasks:
    - name: "[Agent] Retire the overlay agent when disabled"
      ansible.builtin.include_role:
        name: agent
        tasks_from: cleanup
      when: not (netbird_enabled | default(true) | bool)

- name: Optional host monitoring and host security
  hosts: remnanodes
  gather_facts: false
  tasks:
    - name: "[Monitoring] Converge the disabled components off"
      ansible.builtin.include_role:
        name: monitoring
        tasks_from: cleanup
      when: not (monitoring_enabled | default(false) | bool)

    - name: "[Monitoring] Apply the monitoring stack"
      ansible.builtin.include_role:
        name: monitoring
      when: monitoring_enabled | default(false) | bool
