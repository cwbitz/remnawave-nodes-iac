---
- name: Validate operator knobs
  hosts: all
  gather_facts: false
  tasks:
    - name: Load the operator knob schema
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/knob_schema.yml"

    - name: Assert the schema covers every example knob
      ansible.builtin.assert:
        that:
          - operator_knob_schema.keys() | sort == (lookup('file', playbook_dir ~ '/../inventory/host_vars/example/main.yml') | from_yaml).keys() | sort
          - >-
            operator_knob_nested.keys() | map('regex_replace', '\..*$', '') | unique | sort
            | difference(operator_knob_schema.keys()) | length == 0
        fail_msg: "inventory/knob_schema.yml is out of sync with inventory/host_vars/example/main.yml"
        quiet: true

    - name: Validate every operator knob
      ansible.builtin.assert:
        that:
          - "{{ item.value }}"
        fail_msg: >-
          {{ inventory_hostname }}: invalid {{ item.key }} =
          {{ vars[item.key] | default('<unset>') | to_json }}
        quiet: true
      loop: "{{ operator_knob_schema | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate every nested operator knob
      ansible.builtin.assert:
        that:
          - "{{ item.value }}"
        fail_msg: "{{ inventory_hostname }}: invalid {{ item.key }}"
        quiet: true
      loop: "{{ operator_knob_nested | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Reject the removed monitoring master switch
      ansible.builtin.assert:
        that:
          - (monitoring | default({}, true)).enabled is not defined
        fail_msg: >-
          {{ inventory_hostname }}: monitoring.enabled was removed. The slice now
          runs when monitoring.node_exporter.enabled,
          monitoring.crowdsec.enabled or monitoring.alloy.enabled is true; drop
          the key and toggle the components themselves.
        quiet: true
