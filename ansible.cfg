[defaults]
# Paths
inventory               = ./inventory/hosts.yml
roles_path              = ./roles
collections_path        = ./collections
# Ansible home is kept project-local (under the gitignored .cache/) so a project
# run never reads or writes the shared ~/.ansible (runtime temp, ssh control
# sockets, galaxy cache/token, plugin search). Relative paths resolve against
# this config file's directory.
home                    = ./.cache/ansible
vault_password_file     = ~/.config/projects/remnawave-nodes-iac/ansible_vault_password

# Connectivity
host_key_checking       = True
remote_user             = root
timeout                 = 30

# Concurrency
forks                   = 10
retry_files_enabled     = False

# Fact caching
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.cache/facts
fact_caching_timeout    = 86400

# Output
stdout_callback         = default
result_format           = yaml
callbacks_enabled       = timer, profile_tasks
nocows                  = True

# Python interpreter
interpreter_python      = auto_silent

[privilege_escalation]
become                  = False
become_method           = sudo
become_user             = root
become_ask_pass         = False

[ssh_connection]
# Pipelining
pipelining              = True

# Connection persistence
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s
control_path_dir        = ./.cache/ansible/cp
retries                 = 3

[inventory]
# Fail if the inventory cannot be parsed
unparsed_is_failed      = True
