---
# One entry per operator group: the group must be a mapping (or absent).
# The per-knob expressions live in operator_knob_nested, keyed by the dotted
# path the operator sees in inventory/host_vars/<host>/main.yml.
operator_knob_schema:
  host: "host is not defined or host is mapping"
  bootstrap: "bootstrap is not defined or bootstrap is mapping"
  firewall: "firewall is not defined or firewall is mapping"
  sshd: "sshd is not defined or sshd is mapping"
  monitoring: "monitoring is not defined or monitoring is mapping"
  netbird: "netbird is not defined or netbird is mapping"
  remnanode: "remnanode is not defined or remnanode is mapping"
  deploy: "deploy is not defined or deploy is mapping"

operator_knob_nested:
  host.create_admin_account: >-
    ((host | default({}, true)).create_admin_account | default(false)) is boolean
  host.admin_username: >-
    ((host | default({}, true)).admin_username | default('admin')) is string
  host.iac: >-
    ((host | default({}, true)).iac | default({})) is mapping
  host.iac.ssh_pubkey_file: >-
    ((host | default({}, true)).iac | default({})).ssh_pubkey_file | default('')
    is string
  host.iac.ssh_privkey_file: >-
    ((host | default({}, true)).iac | default({})).ssh_privkey_file | default('')
    is string
  host.admin: >-
    ((host | default({}, true)).admin | default({})) is mapping
  host.admin.ssh_pubkey_file: >-
    ((host | default({}, true)).admin | default({})).ssh_pubkey_file | default('')
    is string
  host.admin.ssh_privkey_file: >-
    ((host | default({}, true)).admin | default({})).ssh_privkey_file | default('')
    is string
  host.root: >-
    ((host | default({}, true)).root | default({})) is mapping
  host.root.ssh_pubkey_file: >-
    ((host | default({}, true)).root | default({})).ssh_pubkey_file | default('')
    is string
  host.root.ssh_privkey_file: >-
    ((host | default({}, true)).root | default({})).ssh_privkey_file | default('')
    is string
  bootstrap.install_docker: >-
    ((bootstrap | default({}, true)).install_docker | default(true)) is boolean
  bootstrap.timezone: >-
    ((bootstrap | default({}, true)).timezone | default('', true) | string | trim) == ''
    or ((bootstrap | default({}, true)).timezone | string) is match('^[A-Za-z0-9_+/-]+$')
  bootstrap.apt_mirror: >-
    ((bootstrap | default({}, true)).apt_mirror | default('', true) | string | trim) == ''
    or ((bootstrap | default({}, true)).apt_mirror | string) is match('^https?://[^\s]+/debian/?$')
  bootstrap.docker_registry_mirrors: >-
    ((bootstrap | default({}, true)).docker_registry_mirrors | default([])) is sequence and
    not (((bootstrap | default({}, true)).docker_registry_mirrors | default([])) is string) and
    not (((bootstrap | default({}, true)).docker_registry_mirrors | default([])) is mapping)
  firewall.enabled: >-
    ((firewall | default({}, true)).enabled | default(false)) is boolean
  firewall.public_tcp_ports: >-
    ((firewall | default({}, true)).public_tcp_ports | default([])) is sequence and
    not (((firewall | default({}, true)).public_tcp_ports | default([])) is string) and
    not (((firewall | default({}, true)).public_tcp_ports | default([])) is mapping) and
    ((((firewall | default({}, true)).public_tcp_ports | default([]))
      | map('string') | reject('match', '^[0-9]+(-[0-9]+)?$') | list | length) == 0)
  firewall.public_udp_ports: >-
    ((firewall | default({}, true)).public_udp_ports | default([])) is sequence and
    not (((firewall | default({}, true)).public_udp_ports | default([])) is string) and
    not (((firewall | default({}, true)).public_udp_ports | default([])) is mapping) and
    ((((firewall | default({}, true)).public_udp_ports | default([]))
      | map('string') | reject('match', '^[0-9]+(-[0-9]+)?$') | list | length) == 0)
  firewall.allow_icmp: >-
    ((firewall | default({}, true)).allow_icmp | default(true)) is boolean
  sshd.hardening_enabled: >-
    ((sshd | default({}, true)).hardening_enabled | default(false)) is boolean
  sshd.permit_root_login: >-
    ((sshd | default({}, true)).permit_root_login | default('no') | string)
    in ["no", "prohibit-password"]
  monitoring.enabled: >-
    ((monitoring | default({}, true)).enabled | default(false)) is boolean
  monitoring.node_exporter.enabled: >-
    (((monitoring | default({}, true)).node_exporter | default({})).enabled
     | default(false)) is boolean
  monitoring.node_exporter.collectors: >-
    (((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is string) and
    not ((((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is mapping)
  monitoring.crowdsec.enabled: >-
    (((monitoring | default({}, true)).crowdsec | default({})).enabled
     | default(false)) is boolean
  monitoring.crowdsec.generate_webui_machine_password: >-
    (((monitoring | default({}, true)).crowdsec | default({})).generate_webui_machine_password
     | default(false)) is boolean
  monitoring.crowdsec.blocklist_import: >-
    (((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})) is mapping
  monitoring.crowdsec.blocklist_import.enabled: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).enabled | default(false)) is boolean
  monitoring.crowdsec.blocklist_import.preset: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).preset | default('server') | string)
    in ['embedded', 'server', 'max']
  monitoring.crowdsec.blocklist_import.interval: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).interval | default(3600) | int) >= 0
  monitoring.crowdsec.blocklist_import.max_decisions: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).max_decisions | default(15000) | int) >= 0
  monitoring.crowdsec.blocklist_import.batch_size: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).batch_size | default(1000) | int) >= 1
  monitoring.crowdsec.blocklist_import.decision_duration: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).decision_duration | default('24h') | string)
    is match('^[0-9]+[smh]$')
  monitoring.crowdsec.blocklist_import.extra_env: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).extra_env | default({})) is mapping
  monitoring.alloy.enabled: >-
    (((monitoring | default({}, true)).alloy | default({})).enabled
     | default(false)) is boolean
  monitoring.alloy.loki_push_url: >-
    (((monitoring | default({}, true)).alloy | default({})).loki_push_url
     | default('', true) | string | trim) == ''
    or (((monitoring | default({}, true)).alloy | default({})).loki_push_url
    | string) is match('^https?://[^\s]+$')
  monitoring.alloy.prometheus_remote_write_url: >-
    (((monitoring | default({}, true)).alloy | default({})).prometheus_remote_write_url
     | default('', true) | string | trim) == ''
    or (((monitoring | default({}, true)).alloy | default({})).prometheus_remote_write_url
    | string) is match('^https?://[^\s]+$')
  monitoring.alloy.scrape_interval: >-
    (((monitoring | default({}, true)).alloy | default({})).scrape_interval
     | default('15s') | string) is match('^([1-9]|[12][0-9]|30)s$')
  monitoring.alloy.journal_presets: >-
    (((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is string) and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is mapping)
  monitoring.alloy.journal_extras: >-
    (((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is string) and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is mapping)
  netbird.enabled: >-
    ((netbird | default({}, true)).enabled | default(true)) is boolean
  netbird.management_url: >-
    ((netbird | default({}, true)).management_url | default('', true) | string | trim) == ''
    or ((netbird | default({}, true)).management_url | string) is match('^https?://[^\s]+$')
  remnanode.node_port: >-
    ((remnanode | default({}, true)).node_port | default('') | string | trim)
    is match('^[0-9]{1,5}$') and
    ((remnanode | default({}, true)).node_port | default(0) | int) >= 1 and
    ((remnanode | default({}, true)).node_port | default(0) | int) <= 65535
  deploy.allow_root_login: >-
    ((deploy | default({}, true)).allow_root_login | default(false)) is boolean
