---
host_defaults:
  create_admin_account: false
  admin_username: "admin"
  iac:
    ssh_pubkey_file: ""
    ssh_privkey_file: ""
  admin:
    ssh_pubkey_file: ""
    ssh_privkey_file: ""
  root:
    ssh_pubkey_file: ""
    ssh_privkey_file: ""

host_cfg: "{{ host_defaults | combine(host | default({}, true), recursive=True) }}"
create_admin_account: "{{ host_cfg.create_admin_account }}"
host_admin_username: "{{ host_cfg.admin_username }}"
host_iac_ssh_pubkey_file: "{{ host_cfg.iac.ssh_pubkey_file }}"
host_iac_ssh_privkey_file: "{{ host_cfg.iac.ssh_privkey_file }}"
host_admin_ssh_pubkey_file: "{{ host_cfg.admin.ssh_pubkey_file }}"
host_admin_ssh_privkey_file: "{{ host_cfg.admin.ssh_privkey_file }}"
host_root_ssh_pubkey_file: "{{ host_cfg.root.ssh_pubkey_file }}"
host_root_ssh_privkey_file: "{{ host_cfg.root.ssh_privkey_file }}"

bootstrap_defaults:
  install_docker: true
  timezone: "UTC"
  apt_mirror: ""
  docker_registry_mirrors: []

bootstrap_cfg: "{{ bootstrap_defaults | combine(bootstrap | default({}, true), recursive=True) }}"
install_docker: "{{ bootstrap_cfg.install_docker }}"
timezone: "{{ bootstrap_cfg.timezone }}"
apt_mirror: "{{ bootstrap_cfg.apt_mirror }}"
docker_registry_mirrors: "{{ bootstrap_cfg.docker_registry_mirrors }}"

firewall_defaults:
  enabled: false
  public_tcp_ports: ["22"]
  public_udp_ports: []
  allow_icmp: true

firewall_cfg: "{{ firewall_defaults | combine(firewall | default({}, true), recursive=True) }}"
firewall_enabled: "{{ firewall_cfg.enabled }}"
firewall_public_tcp_ports: "{{ firewall_cfg.public_tcp_ports }}"
firewall_public_udp_ports: "{{ firewall_cfg.public_udp_ports }}"
firewall_allow_icmp: "{{ firewall_cfg.allow_icmp }}"

sshd_defaults:
  hardening_enabled: false
  permit_root_login: "no"

sshd_cfg: "{{ sshd_defaults | combine(sshd | default({}, true), recursive=True) }}"
sshd_hardening_enabled: "{{ sshd_cfg.hardening_enabled }}"
sshd_permit_root_login: "{{ sshd_cfg.permit_root_login }}"

monitoring_defaults:
  enabled: false
  node_exporter:
    enabled: false
    collectors:
      - buddyinfo
      - cgroups
      - drm
      - ethtool
      - interrupts
      - ksmd
      - lnstat
      - logind
      - mountstats
      - perf
      - processes
      - qdisc
      - softirqs
      - sysctl
      - tcpstat
      - wifi
      - xfrm
      - zoneinfo
  crowdsec:
    enabled: false
    generate_webui_machine_password: false
    blocklist_import:
      enabled: false
      preset: "server"
      interval: 3600
      max_decisions: 15000
      batch_size: 1000
      decision_duration: "24h"
      extra_env: {}
  alloy:
    enabled: false
    loki_push_url: ""
    prometheus_remote_write_url: ""
    scrape_interval: "15s"
    journal_presets: [ssh, security, kernel, services]
    journal_extras: []

monitoring_cfg: "{{ monitoring_defaults | combine(monitoring | default({}, true), recursive=True) }}"
monitoring_enabled: "{{ monitoring_cfg.enabled }}"
node_exporter_enabled: "{{ monitoring_cfg.node_exporter.enabled }}"
node_exporter_collectors: "{{ monitoring_cfg.node_exporter.collectors }}"
crowdsec_enabled: "{{ monitoring_cfg.crowdsec.enabled }}"
crowdsec_generate_webui_machine_password: >-
  {{ monitoring_cfg.crowdsec.generate_webui_machine_password }}
crowdsec_blocklist_import_enabled: "{{ monitoring_cfg.crowdsec.blocklist_import.enabled }}"
crowdsec_blocklist_import_preset: "{{ monitoring_cfg.crowdsec.blocklist_import.preset }}"
crowdsec_blocklist_import_interval: "{{ monitoring_cfg.crowdsec.blocklist_import.interval }}"
crowdsec_blocklist_import_max_decisions: >-
  {{ monitoring_cfg.crowdsec.blocklist_import.max_decisions }}
crowdsec_blocklist_import_batch_size: >-
  {{ monitoring_cfg.crowdsec.blocklist_import.batch_size }}
crowdsec_blocklist_import_decision_duration: >-
  {{ monitoring_cfg.crowdsec.blocklist_import.decision_duration }}
crowdsec_blocklist_import_extra_env: "{{ monitoring_cfg.crowdsec.blocklist_import.extra_env }}"
alloy_enabled: "{{ monitoring_cfg.alloy.enabled }}"
loki_push_url: "{{ monitoring_cfg.alloy.loki_push_url }}"
prometheus_remote_write_url: "{{ monitoring_cfg.alloy.prometheus_remote_write_url }}"
alloy_scrape_interval: "{{ monitoring_cfg.alloy.scrape_interval }}"
alloy_journal_presets: "{{ monitoring_cfg.alloy.journal_presets }}"
alloy_journal_extras: "{{ monitoring_cfg.alloy.journal_extras }}"

netbird_defaults:
  enabled: true
  management_url: ""

netbird_cfg: "{{ netbird_defaults | combine(netbird | default({}, true), recursive=True) }}"
netbird_enabled: "{{ netbird_cfg.enabled }}"
netbird_management_url: "{{ netbird_cfg.management_url }}"

remnanode_defaults:
  node_port: ""

remnanode_cfg: "{{ remnanode_defaults | combine(remnanode | default({}, true), recursive=True) }}"
remnanode_node_port: "{{ remnanode_cfg.node_port }}"

deploy_defaults:
  allow_root_login: false

deploy_cfg: "{{ deploy_defaults | combine(deploy | default({}, true), recursive=True) }}"
allow_root_login: "{{ deploy_cfg.allow_root_login }}"
