---
# ==============================================================================
# Per-host configuration (inventory/host_vars/example/main.yml)
# ==============================================================================
# `make host-init` copies this file to inventory/host_vars/<hostname>/main.yml.
# Every knob is listed with its default; secrets/PII go in the encrypted
# vault.yml next to it.

# --- SSH connection identities ------------------------------------------------
# Account name and key paths are non-secret (passwords stay in vault.yml).
# The optional human `admin` account may be renamed; `iac` is a fixed name.
host_admin_username: "admin"
host_iac_ssh_pubkey_file: ""
host_iac_ssh_privkey_file: ""
host_admin_ssh_pubkey_file: ""
host_admin_ssh_privkey_file: ""
host_root_ssh_pubkey_file: ""
host_root_ssh_privkey_file: ""

# ==============================================================================
# NetBird overlay
# ==============================================================================
# The node joins the mesh as a peer. Pick a setup key whose group the central
# observability stack discovers (`endpoint` by default; it grants no exit/LAN
# routes).
netbird_management_url: ""   # empty = NetBird Cloud; a self-hosted mesh sets its URL

# ==============================================================================
# Remnawave Node
# ==============================================================================
# Create the Node in the Remnawave Panel, then copy from its generated
# docker-compose.yml: NODE_PORT here (not a secret) and SECRET_KEY into the vault
# (vault_remnanode_secret_key).
remnanode_node_port: ""     # e.g. 2222: the port the Panel dials in on

# ==============================================================================
# Host monitoring + host security (make monitoring)
# ==============================================================================
# prometheus-node-exporter + CrowdSec (+ the nftables firewall bouncer) and the
# NetBird overlay join, so the central Prometheus/Alloy scrapes the host over the
# overlay with no public port. Enabled by default for this group; set
# monitoring_enabled false to opt out (each component can be disabled on its own).
monitoring_enabled: false
node_exporter_enabled: false
crowdsec_enabled: false
# Optionally ship host logs to a central Loki reachable over the overlay
# (alloy_enabled requires loki_push_url): an overlay IP, or preferably the central
# peer's NetBird name ("http://<peer>.netbird.selfhosted:3100"), which survives a
# re-enrolled central peer.
alloy_enabled: false
loki_push_url: ""

# Journal sources Alloy ships to the central Loki; raw extra matches go in
# alloy_journal_extras.
alloy_journal_presets: [ssh, security, kernel, services]
alloy_journal_extras: []

# ==============================================================================
# Host firewall
# ==============================================================================
# Default-deny inbound (a dedicated nftables table; enabled by default for this
# group). SSH, the NetBird overlay and the WireGuard UDP port stay open; NODE_PORT
# and everything else are reachable only over the overlay. The Panel owns the Xray
# inbounds, so declare the ports it pushes here (empty = no proxy service yet).
# Each entry is a single port or a `start-end` range, so the Panel's own value can
# be copied verbatim, e.g. ["443"] and ["20000-20100"]. The two projects are
# decoupled: keep these in step with the Panel's inbound ports by hand.
firewall_enabled: false
firewall_public_tcp_ports: ["22"]
firewall_public_udp_ports: []
firewall_allow_icmp: true

# ==============================================================================
# SSH hardening
# ==============================================================================
# Key-only SSH administration. Enable it only once a keyed login works for
# `iac` (or root when that is the only admin path); the role verifies that
# and fails otherwise.
sshd_hardening_enabled: false
# Root SSH policy, independent of the toggle above: "no" disables root SSH;
# "prohibit-password" keeps root reachable by public key only (needed on a host
# administered only through root).
sshd_permit_root_login: "no"

# ==============================================================================
# Host bootstrap (make host-bootstrap; NOT part of make deploy)
# ==============================================================================
# install_docker false requires a preinstalled Docker. Mirrors for hosts where the
# defaults are slow or blocked; the security repo follows apt_mirror.
install_docker: true
apt_mirror: ""
docker_registry_mirrors: []
# The optional human 'admin' operator account: console login + sudo, always with
# a password (generated into vault_host_admin_password when empty) plus any
# configured public key. Created only when enabled.
create_admin_account: false
# Escape hatch: run the deploy as root instead of the service account (not
# recommended).
allow_root_login: false
