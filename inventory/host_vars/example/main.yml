---
# ==============================================================================
# Per-host configuration (inventory/host_vars/example/main.yml)
# ==============================================================================
# `make host-init` copies this file to inventory/host_vars/<hostname>/main.yml.
# Every knob is listed with its default; secrets/PII go in the encrypted
# vault.yml next to it.

# ==============================================================================
# NetBird overlay (roles/agent)
# ==============================================================================
# The node joins the mesh as a peer. The management server is owned by the
# sibling netbird-iac project; this project consumes the mesh ONLY through its
# public interface, so both inputs are owned by THIS project (never read from
# netbird-iac). The setup key decides which group the peer auto-joins — pick the
# key whose group the central observability stack discovers (`endpoint` by
# default, which grants no exit/LAN routes).
netbird_management_url: ""   # empty = NetBird Cloud; a self-hosted mesh sets its URL
netbird_peer_setup_key: "{{ vault_netbird_setup_key }}"

# ==============================================================================
# Remnawave Node (roles/remnanode)
# ==============================================================================
# Create the Node in the Remnawave Panel, then copy from its generated
# docker-compose.yml: NODE_PORT here (not a secret) and SECRET_KEY into the vault
# (vault_remnanode_secret_key). The rest of that file is the committed template
# roles/remnanode/templates/remnanode/docker-compose.yml.j2.
remnanode_node_port: ""     # e.g. 2222: the port the Panel dials in on
remnanode_secret_key: "{{ vault_remnanode_secret_key }}"

# ==============================================================================
# Host monitoring + host security (roles/monitoring; make monitoring)
# ==============================================================================
# prometheus-node-exporter + CrowdSec (+ the nftables firewall bouncer) and the
# NetBird overlay join, so the central Prometheus/Alloy (sibling docker-stack-iac)
# scrapes the host over the overlay with no public port. Enabled by default for
# this group; set monitoring_enabled false to opt out (each component can be
# disabled on its own as well).
monitoring_enabled: true
node_exporter_enabled: true
crowdsec_enabled: true
# node_exporter has no knob: it binds the overlay address only (the central
# Prometheus scrapes it over the mesh; nothing listens locally or publicly).
# Optionally ship host logs to a central Loki reachable over the overlay
# (alloy_enabled requires loki_push_url): an overlay IP, or preferably the central
# peer's NetBird name ("http://<peer>.netbird.selfhosted:3100"), which survives a
# re-enrolled central peer.
alloy_enabled: false
loki_push_url: ""

# Journal sources Alloy ships to the central Loki (see
# roles/monitoring/defaults/main.yml). Raw extra matches go in
# alloy_journal_extra.
alloy_journal_presets: [ssh, security, kernel, services]
alloy_journal_extra: []

# ==============================================================================
# Host firewall (roles/firewall)
# ==============================================================================
# Default-deny inbound (a dedicated nftables table; enabled by default for this
# group). SSH, the NetBird overlay and the WireGuard UDP port stay open; NODE_PORT
# and everything else are reachable only over the overlay. The Panel owns the Xray
# inbounds, so declare the ports it pushes here (empty = no proxy service yet).
# Each entry is a single port or a `start-end` range, so the Panel's own value can
# be copied verbatim, e.g. ["443"] and ["20000-20100"]. The two projects are
# decoupled: keep these in step with the Panel's inbound ports by hand.
firewall_enabled: true
firewall_ssh_port: "{{ ansible_port | default(22) | int }}"
firewall_public_tcp_ports: []
firewall_public_udp_ports: []
firewall_allow_icmp: true

# ==============================================================================
# SSH hardening (roles/sshd)
# ==============================================================================
# Key-only SSH administration: PasswordAuthentication no (plus the PAM
# keyboard-interactive and empty-password paths), applied as a drop-in in
# /etc/ssh/sshd_config.d/. OFF by default, because it removes the password path
# host-bootstrap falls back to: it is only safe once a keyed login survives it —
# the `ansible` account's key (vault_host_ansible_ssh_pubkey_file), or root's key
# on a root-administered host — which the role proves and fails the run
# otherwise.
sshd_hardening_enabled: false
# Root SSH policy, independent of the toggle above: "no" disables root SSH;
# "prohibit-password" keeps root reachable by public key only (needed on a host
# administered only through root).
sshd_permit_root_login: "no"

# ==============================================================================
# Host bootstrap (make host-bootstrap; NOT part of make deploy)
# ==============================================================================
# install_docker false requires a preinstalled Docker. Region-specific mirrors for
# hosts where the defaults are slow/blocked (e.g. China-based VPS): the security
# mirror is derived from apt_mirror, and Docker Hub registry mirrors are
# tried in order.
install_docker: true
apt_mirror: ""
docker_registry_mirrors: []
# The APT security repository is derived from apt_mirror (it is not a knob).
# The optional human 'admin' operator account: console login + sudo, always with
# a password (generated into vault_host_admin_password when empty) plus any
# configured public key. Created only when enabled.
create_admin_account: false
# Escape hatch: run the deploy as root instead of the service account (not
# recommended).
allow_root_login: false
