---
# ==============================================================================
# Per-host configuration template (inventory/host_vars/example/main.yml)
# ==============================================================================
# Copy to inventory/host_vars/<hostname>/main.yml for each host (only example/ is
# committed; real <hostname>/ directories are gitignored). Secrets/PII go in the
# encrypted vault.yml next to it; the shared SSH connection wiring lives in
# inventory/group_vars/remnanodes/main.yml.

# --- SSH connection identity -------------------------------------------------
# The ansible/admin/root aliases are wired in
# inventory/group_vars/remnanodes/main.yml; the user/password/key paths live
# in vault.yml (see vault.yml.example). `make host-bootstrap` probes
# [ansible, admin, root] and uses the first that works; normal runs use `ansible`.

# ==============================================================================
# NetBird overlay (roles/agent)
# ==============================================================================
# The node joins the mesh as a peer. The management server is owned by the
# sibling netbird-iac project; this project consumes the mesh ONLY through its
# public interface, so both inputs are owned by THIS project (never read from
# netbird-iac). The setup key decides which group the peer auto-joins — pick the
# key whose group the central observability stack discovers (`endpoint` by
# default, which grants no exit/LAN routes).
netbird_management_url: "https://netbird.example.com"   # empty = NetBird Cloud
peer_setup_key: "{{ vault_netbird_setup_key }}"
# Set true only when this node routes traffic for a routed network / exit node;
# it enables IPv4/IPv6 forwarding on the host.
netbird_agent_routing: false

# ==============================================================================
# Remnawave Node (roles/remnanode)
# ==============================================================================
# Create the Node in the Remnawave Panel, then copy from its generated
# docker-compose.yml: NODE_PORT here (not a secret) and SECRET_KEY into the vault
# (vault_remnanode_secret_key). The rest of that file is the committed template
# roles/remnanode/templates/remnanode/docker-compose.yml.j2.
remnanode_node_port: ""     # e.g. 2222: the port the Panel dials in on
remnanode_secret_key: "{{ vault_remnanode_secret_key }}"

# --- Optional host monitoring + host security (make monitoring) --------------
# Installs prometheus-node-exporter + CrowdSec (+ the nftables firewall bouncer)
# and joins the NetBird overlay, so the central Prometheus/Alloy (sibling
# docker-stack-iac) scrapes the host over the overlay with no public port.
# Enabled by default for this group; set false to opt out.
# monitoring_enabled: false
# node_exporter is localhost-only plus the overlay address; widen the local
# address only when a trusted scraper must reach it.
# node_exporter_listen_addr: "127.0.0.1:9100"
# Optionally ship host logs to a central Loki reachable over the overlay.
# alloy_enabled: true
# loki_url: "http://<loki-overlay-ip>:3100"

# --- Optional host bootstrap (make host-bootstrap; NOT part of make deploy) --
# Region-specific mirrors for hosts where the defaults are slow/blocked (e.g.
# China-based VPS). The security mirror is derived from host_apt_mirror (override
# with host_apt_security_mirror); Docker Hub registry mirrors are tried in order.
# host_apt_mirror: "https://mirrors.tuna.tsinghua.edu.cn/debian"
# docker_registry_mirrors:
#   - "https://docker.1ms.run"
# The probe, the 'ansible' service account and key/password handling are
# documented in playbooks/bootstrap.yml and vault.yml.example. Create the
# optional human 'admin' account with (it always gets a password):
# host_admin_enabled: true
