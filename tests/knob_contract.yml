---
- name: Validate the knob schema against the role domains
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../inventory/knob_schema.yml
  tasks:
    - name: Set a single node port
      ansible.builtin.set_fact:
        remnanode_node_port: "2222"
    - name: Assert the schema accepts a single node port
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.remnanode_node_port }}"
        quiet: true

    - name: Set a ranged node port
      ansible.builtin.set_fact:
        remnanode_node_port: "2222-2223"
    - name: Evaluate the schema with a ranged node port
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.remnanode_node_port }}"
        quiet: true
      register: ranged_node_port
      ignore_errors: true
    - name: Assert the schema rejects a ranged node port
      ansible.builtin.assert:
        that:
          - ranged_node_port.failed | default(false)
        quiet: true

    - name: Set an empty node port
      ansible.builtin.set_fact:
        remnanode_node_port: ""
    - name: Evaluate the schema with an empty node port
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.remnanode_node_port }}"
        quiet: true
      register: empty_node_port
      ignore_errors: true
    - name: Assert the schema rejects an empty node port
      ansible.builtin.assert:
        that:
          - empty_node_port.failed | default(false)
        quiet: true

    - name: Set a boolean readiness-skip toggle
      ansible.builtin.set_fact:
        remnanode_skip_readiness_check: true
    - name: Assert the schema accepts a boolean readiness-skip toggle
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.remnanode_skip_readiness_check }}"
        quiet: true

    - name: Set a string readiness-skip toggle
      ansible.builtin.set_fact:
        remnanode_skip_readiness_check: "true"
    - name: Evaluate the schema with a string readiness-skip toggle
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.remnanode_skip_readiness_check }}"
        quiet: true
      register: string_skip_readiness
      ignore_errors: true
    - name: Assert the schema rejects a string readiness-skip toggle
      ansible.builtin.assert:
        that:
          - string_skip_readiness.failed | default(false)
        quiet: true

    - name: Set a key-only root policy
      ansible.builtin.set_fact:
        sshd:
          permit_root_login: "prohibit-password"
    - name: Assert the schema accepts a key-only root policy
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['sshd.permit_root_login'] }}"
        quiet: true

    - name: Set a password root policy
      ansible.builtin.set_fact:
        sshd:
          permit_root_login: "yes"
    - name: Evaluate the schema with a password root policy
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['sshd.permit_root_login'] }}"
        quiet: true
      register: password_root_login
      ignore_errors: true
    - name: Assert the schema rejects a password root policy
      ansible.builtin.assert:
        that:
          - password_root_login.failed | default(false)
        quiet: true

    - name: Set the NetBird Cloud default
      ansible.builtin.set_fact:
        netbird:
          management_url: ""
    - name: Assert the schema accepts the NetBird Cloud default
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['netbird.management_url'] }}"
        quiet: true

    - name: Set a self-hosted NetBird URL
      ansible.builtin.set_fact:
        netbird:
          management_url: "https://netbird.example.com"
    - name: Assert the schema accepts a self-hosted NetBird URL
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['netbird.management_url'] }}"
        quiet: true

    - name: Set a bare NetBird host
      ansible.builtin.set_fact:
        netbird:
          management_url: "netbird.example.com"
    - name: Evaluate the schema with a bare NetBird host
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['netbird.management_url'] }}"
        quiet: true
      register: bare_netbird_host
      ignore_errors: true
    - name: Assert the schema rejects a bare NetBird host
      ansible.builtin.assert:
        that:
          - bare_netbird_host.failed | default(false)
        quiet: true

    - name: Set a Debian suite root
      ansible.builtin.set_fact:
        mirrors:
          apt: "https://mirror.example.com/debian"
    - name: Assert the schema accepts a Debian suite root
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.mirrors }}"
        quiet: true

    - name: Set a mirror URL without the suite path
      ansible.builtin.set_fact:
        mirrors:
          apt: "https://mirror.example.com"
    - name: Evaluate the schema with a mirror URL without the suite path
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.mirrors }}"
        quiet: true
      register: mirror_without_suite
      ignore_errors: true
    - name: Assert the schema rejects a mirror URL without the suite path
      ansible.builtin.assert:
        that:
          - mirror_without_suite.failed | default(false)
        quiet: true

    - name: Set the metric scrape cadence
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            scrape_interval: "15s"
    - name: Assert the schema accepts the metric scrape cadence
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.scrape_interval'] }}"
        quiet: true

    - name: Set the slowest usable metric scrape cadence
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            scrape_interval: "30s"
    - name: Assert the schema accepts the slowest usable metric scrape cadence
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.scrape_interval'] }}"
        quiet: true

    - name: Set a scrape cadence outside the rate window
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            scrape_interval: "60s"
    - name: Evaluate the schema with a scrape cadence outside the rate window
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.scrape_interval'] }}"
        quiet: true
      register: slow_scrape_interval
      ignore_errors: true
    - name: Assert the schema rejects a scrape cadence outside the rate window
      ansible.builtin.assert:
        that:
          - slow_scrape_interval.failed | default(false)
        quiet: true

    - name: Set a Prometheus remote-write base URL
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            prometheus_remote_write_url: "http://central.example:9090"
    - name: Assert the schema accepts a remote-write base URL
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.prometheus_remote_write_url'] }}"
        quiet: true

    - name: Set a remote-write URL that already carries the appended path
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            prometheus_remote_write_url: "http://central.example:9090/api/v1/write"
    - name: Evaluate the schema with a remote-write URL that already carries the path
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.prometheus_remote_write_url'] }}"
        quiet: true
      register: write_url_with_path
      ignore_errors: true
    - name: Assert the schema rejects a remote-write URL that already carries the path
      ansible.builtin.assert:
        that:
          - write_url_with_path.failed | default(false)
        quiet: true

    - name: Set a local verification receiver
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            verify_receiver:
              mode: "ack"
              port: 3100
    - name: Assert the schema accepts a local verification receiver
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.verify_receiver.mode'] }}"
        quiet: true

    - name: Set a receiver mode outside the domain
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            verify_receiver:
              mode: "off"
    - name: Evaluate the schema with a receiver mode outside the domain
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.verify_receiver.mode'] }}"
        quiet: true
      register: receiver_mode_outside_domain
      ignore_errors: true
    - name: Assert the schema rejects a receiver mode outside the domain
      ansible.builtin.assert:
        that:
          - receiver_mode_outside_domain.failed | default(false)
        quiet: true

    - name: Set a receiver port outside the range
      ansible.builtin.set_fact:
        monitoring:
          alloy:
            verify_receiver:
              port: 70000
    - name: Evaluate the schema with a receiver port outside the range
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['monitoring.alloy.verify_receiver.port'] }}"
        quiet: true
      register: receiver_port_outside_range
      ignore_errors: true
    - name: Assert the schema rejects a receiver port outside the range
      ansible.builtin.assert:
        that:
          - receiver_port_outside_range.failed | default(false)
        quiet: true

    - name: Set a boolean overlay toggle
      ansible.builtin.set_fact:
        netbird:
          enabled: true
    - name: Assert the schema accepts a boolean overlay toggle
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['netbird.enabled'] }}"
        quiet: true

    - name: Set a string overlay toggle
      ansible.builtin.set_fact:
        netbird:
          enabled: "yes"
    - name: Evaluate the schema with a string overlay toggle
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['netbird.enabled'] }}"
        quiet: true
      register: string_overlay_toggle
      ignore_errors: true
    - name: Assert the schema rejects a string overlay toggle
      ansible.builtin.assert:
        that:
          - string_overlay_toggle.failed | default(false)
        quiet: true

    - name: Set a valid firewall port list
      ansible.builtin.set_fact:
        firewall:
          public_tcp_ports: ["22", "443", "20000-20100"]
    - name: Assert the schema accepts port and range entries
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['firewall.public_tcp_ports'] }}"
        quiet: true

    - name: Set an invalid firewall port entry
      ansible.builtin.set_fact:
        firewall:
          public_tcp_ports: ["https"]
    - name: Evaluate the schema with an invalid firewall port entry
      ansible.builtin.assert:
        that: "{{ operator_knob_nested['firewall.public_tcp_ports'] }}"
        quiet: true
      register: invalid_port_entry
      ignore_errors: true
    - name: Assert the schema rejects an invalid firewall port entry
      ansible.builtin.assert:
        that:
          - invalid_port_entry.failed | default(false)
        quiet: true

    - name: Set a grouped monitoring mapping
      ansible.builtin.set_fact:
        monitoring:
          node_exporter:
            enabled: true
    - name: Assert the schema accepts a grouped mapping
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.monitoring }}"
        quiet: true

    - name: Set the monitoring group to a string
      ansible.builtin.set_fact:
        monitoring: "enabled"
    - name: Evaluate the schema with a string group
      ansible.builtin.assert:
        that: "{{ operator_knob_schema.monitoring }}"
        quiet: true
      register: string_group
      ignore_errors: true
    - name: Assert the schema rejects a string group
      ansible.builtin.assert:
        that:
          - string_group.failed | default(false)
        quiet: true

    - name: Load the knob cascade
      ansible.builtin.include_vars:
        file: ../inventory/group_vars/all/knobs.yml

    - name: Enable a single monitoring component
      ansible.builtin.set_fact:
        monitoring:
          crowdsec:
            enabled: true
    - name: Assert the monitoring slice is derived on
      ansible.builtin.assert:
        that:
          - monitoring_enabled | bool
        quiet: true

    - name: Disable every monitoring component
      ansible.builtin.set_fact:
        monitoring: {}
    - name: Assert the monitoring slice is derived off
      ansible.builtin.assert:
        that:
          - not (monitoring_enabled | bool)
        quiet: true
