[tasks.lint]
description = "Syntax check + ansible-lint (make lint)"
run = "make lint"

[tasks.install]
description = "Install the pinned toolchain + collections (make install)"
run = "make install"

[tasks.dry-run]
description = "Dry-run the site playbook (make dry-run)"
run = "make dry-run"

[tasks.deploy]
description = "Deploy the Remnawave node stack (make deploy)"
run = "make deploy"
