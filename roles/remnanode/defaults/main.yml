---
# ==============================================================================
# Remnawave node - role defaults (roles/remnanode/defaults/main.yml)
# ==============================================================================
# Deploys the Remnawave Node container (Xray-core proxy node) that is managed by
# the Remnawave Panel. The Panel (control plane) lives in the sibling
# docker-stack-iac project; this project only runs the Nodes.

# Rendered docker-compose project directory for the node.
remnanode_dir: "/opt/remnanode"

# Created in the Panel, then copied from its "Copy docker-compose.yml" output:
# NODE_PORT here (non-secret) and SECRET_KEY in the vault.
#   remnanode_node_port  the NODE_PORT value (what the Panel dials in on)
#   remnanode_secret_key the SECRET_KEY value (node <-> panel secret)
remnanode_node_port: ""
remnanode_secret_key: "{{ vault_remnanode_secret_key | default('', true) }}"

# Node image. Upstream publishes moving tags (`latest` / `sha-*`); the value the
# Panel generates is `latest`, so that is the default. Renovate tracks it (manual
# review, see renovate.json).
# renovate: datasource=docker depName=remnawave/node
remnanode_version: "latest"
