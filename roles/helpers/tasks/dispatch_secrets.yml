---
# ==============================================================================
# Shared per-host encrypted secret provisioning (entry point)
# (roles/helpers/tasks/dispatch_secrets.yml)
#
# Generates per-host secrets on the control node and persists them in the
# authoritative encrypted per-host vault file:
#   inventory/host_vars/<host>/<secrets_vault_file>
# These are control-authoritative (the control node generates them and passes
# them to the host) and live in vault.yml. Host-returned values use
# store_secret instead. A secret counts as MISSING
# (and is generated) when it is undefined, null, or empty/whitespace-only in the
# inventory; existing non-empty secrets are preserved (never rotated). The
# per-host vault file is auto-loaded by the inventory on later runs.
#
# Parameters (passed via include vars):
#   secrets_component  Human-readable component name (fail messages)
#   secrets_vault_file Vault filename, e.g. vault.yml
#   secrets_list       List of { var, type, length }:
#                          var    Vault variable name, e.g. vault_crowdsec_bouncer_key
#                          type   OpenSSL encoding: base64 | hex
#                          length Bytes of entropy to generate
# ==============================================================================

- name: "[VaultSecrets] Check control-node prerequisites"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.include_tasks: control_node_prereqs.yml

- name: "[VaultSecrets] Validate secret list contract"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.assert:
    that:
      - secrets_list is defined
      - secrets_list | length > 0
      - secrets_component is defined and (secrets_component | string | trim) | length > 0
      - secrets_vault_file is defined and (secrets_vault_file | string | trim) | length > 0
      - secrets_vault_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - secrets_list | map(attribute='var') | list | unique | length == secrets_list | length
    fail_msg: >-
      Invalid {{ secrets_component | default('secrets') }}
      provisioning call: secrets_list must be a non-empty list of
      {var, type, length} with unique var names, secrets_vault_file
      a safe *.yml filename, and secrets_component a non-empty string.
  run_once: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Validate each secret definition"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.assert:
    that:
      - item.var is defined and item.var is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - item.type is defined and item.type in ['base64', 'hex']
      - item.length is defined and (item.length | string) is regex('^[0-9]+$') and (item.length | int) > 0
    fail_msg: >-
      Invalid secret definition for {{ item.var | default('(undefined)') }} in
      {{ secrets_component | default('secrets') }}: var must
      match ^[a-zA-Z_][a-zA-Z0-9_]*$, type must be base64|hex, and length must
      be a positive integer.
  loop: "{{ secrets_list }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Determine which secrets are missing for this host"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.set_fact:
    secrets_missing: >-
      {%- set ns = namespace(missing=[]) -%}
      {%- for item in secrets_list -%}
      {%-   set value = hostvars[inventory_hostname].get(item.var) -%}
      {%-   if (value is none) or ((value | string | trim) | length == 0) -%}
      {%-     set ns.missing = ns.missing + [item.var] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.missing }}
  no_log: true

- name: "[VaultSecrets] Generate and persist per-host secrets"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.include_tasks: generate_secrets.yml
  run_once: true
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    loop_var: target_host

- name: "[VaultSecrets] Load provisioned secrets into this run"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ secrets_vault_file }}"
  when: secrets_missing | length > 0
