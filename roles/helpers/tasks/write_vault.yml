---
- name: "[VaultWrite] Validate the write contract"
  tags: [always]
  ansible.builtin.assert:
    that:
      - write_vault_dir is defined and (write_vault_dir | string | trim) | length > 0
      - write_vault_file is defined and (write_vault_file | string | trim) | length > 0
      - write_vault_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - write_vault_data is defined and write_vault_data is mapping
    fail_msg: "write_vault requires write_vault_dir, a safe *.yml write_vault_file, and mapping write_vault_data."
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultWrite] Ensure the vault directory exists"
  tags: [always]
  ansible.builtin.file:
    path: "{{ write_vault_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultWrite] Persist the encrypted vault file"
  tags: [always]
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  block:
    - name: "[VaultWrite] Create a throwaway plaintext file"
      ansible.builtin.tempfile:
        state: file
        suffix: ".yml"
      register: write_vault_tmp
      changed_when: false

    - name: "[VaultWrite] Render the plaintext content"
      ansible.builtin.copy:
        dest: "{{ write_vault_tmp.path }}"
        content: "{{ write_vault_data | to_nice_yaml(sort_keys=true) }}"
        mode: "0600"
      no_log: true
      changed_when: false

    - name: "[VaultWrite] Encrypt into the vault file"
      ansible.builtin.command:
        argv:
          - "{{ helper_ansible_vault_bin }}"
          - encrypt
          - --vault-password-file
          - "{{ helper_vault_password_file }}"
          - --encrypt-vault-id
          - default
          - --output
          - "{{ write_vault_dir }}/{{ write_vault_file }}"
          - "{{ write_vault_tmp.path }}"
      changed_when: true
      no_log: true
  always:
    - name: "[VaultWrite] Remove the throwaway plaintext file"
      ansible.builtin.file:
        path: "{{ write_vault_tmp.path }}"
        state: absent
      when:
        - write_vault_tmp is defined
        - write_vault_tmp.path is defined
      no_log: true
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
