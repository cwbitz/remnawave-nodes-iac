---
# ==============================================================================
# Host firewall (roles/firewall/tasks)
# ==============================================================================
# Default-deny inbound for the Node host, applied through a dedicated nftables
# table and persisted by a oneshot systemd unit that validates before loading.
# Keeps NODE_PORT (and everything else) off the public internet while the overlay
# stays fully open. Never flushes the ruleset, so it coexists with Docker,
# CrowdSec, NetBird and the Node's own table.
#
# Safety: SSH is always allowed, the ruleset is validated (`nft -c`) before it is
# applied, and the connection is re-checked after applying, so a mistake fails
# the run loudly instead of silently locking the host out.
# ==============================================================================

# Validate everything BEFORE touching the live ruleset: the retire steps below
# remove the previous table, so a bad port spec must fail while the host is still
# protected by the rules it already has.
- name: "[Firewall] Assert the nft binary is available"
  ansible.builtin.command: "{{ firewall_nft }} --version"
  register: firewall_nft_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: "[Firewall] Fail when nft is missing"
  ansible.builtin.assert:
    that:
      - firewall_nft_version.rc | default(1) == 0
    fail_msg: >-
      nftables is required by the host firewall but the `nft` binary is missing
      on {{ inventory_hostname }}. Install the `nftables` package (it also ships
      CrowdSec's firewall bouncer) and re-run.

- name: "[Firewall] Assert the public port knobs are lists"
  ansible.builtin.assert:
    that:
      - firewall_public_tcp_ports is sequence
      - firewall_public_tcp_ports is not string
      - firewall_public_udp_ports is sequence
      - firewall_public_udp_ports is not string
    fail_msg: >-
      firewall_public_tcp_ports / firewall_public_udp_ports must be YAML lists
      whose entries are a port or a `start-end` range, e.g. ["443"] and
      ["20000-20100"].

# Each public port knob takes a single port or a `start-end` range (the same
# syntax the Panel's inbound port uses, e.g. `["443", "20000-20100"]`). Normalize
# to strings for validation, then let nftables render the ranges natively.
- name: "[Firewall] Normalize the public port specs"
  ansible.builtin.set_fact:
    firewall_public_tcp_specs: "{{ firewall_public_tcp_ports | map('string') | list }}"
    firewall_public_udp_specs: "{{ firewall_public_udp_ports | map('string') | list }}"

- name: "[Firewall] Assert the port knobs are valid"
  ansible.builtin.assert:
    that:
      - firewall_ssh_port | int >= 1
      - firewall_ssh_port | int <= 65535
      - firewall_netbird_wg_port | int >= 1
      - firewall_netbird_wg_port | int <= 65535
      - item is match('^[0-9]+(-[0-9]+)?$')
      - (item.split('-') | first | int) >= 1
      - (item.split('-') | last | int) <= 65535
      - (item.split('-') | length) == 1 or (item.split('-') | first | int) <= (item.split('-') | last | int)
    fail_msg: >-
      firewall_public_*_ports entries must be a single port (1-65535) or a
      `start-end` range with start <= end; got {{ item }}. Also check ssh={{
      firewall_ssh_port }} and netbird_wg={{ firewall_netbird_wg_port }}.
  loop: "{{ firewall_public_tcp_specs + firewall_public_udp_specs }}"
  loop_control:
    label: "{{ item }}"

- name: "[Firewall] Stop the previous unit"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ firewall_legacy_services | default([]) }}"
  failed_when: false
  when: not ansible_check_mode

- name: "[Firewall] Retire the previous unit file and ruleset"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ firewall_legacy_paths | default([]) }}"
  when: not ansible_check_mode

- name: "[Firewall] Drop the previous table still loaded in the kernel"
  ansible.builtin.command:
    argv:
      - "{{ firewall_nft }}"
      - delete
      - table
      - inet
      - "{{ item }}"
  loop: "{{ firewall_legacy_tables | default([]) }}"
  changed_when: true
  failed_when: false
  when: not ansible_check_mode

- name: "[Firewall] Ensure the nftables config directory exists"
  ansible.builtin.file:
    path: "{{ firewall_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[Firewall] Render the host firewall ruleset"
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: "{{ firewall_conf }}"
    owner: root
    group: root
    mode: "0644"
  register: firewall_rules

- name: "[Firewall] Validate the rendered ruleset"
  ansible.builtin.command: "{{ firewall_nft }} -c -f {{ firewall_conf }}"
  changed_when: false
  when:
    - firewall_rules.changed | bool
    - not ansible_check_mode

- name: "[Firewall] Install the boot unit"
  ansible.builtin.template:
    src: firewall.service.j2
    dest: "{{ firewall_service_path }}"
    owner: root
    group: root
    mode: "0644"

- name: "[Firewall] Enable the boot unit"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: "[Firewall] Apply the ruleset when it changed"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    state: restarted
  when:
    - firewall_rules.changed | bool
    - not ansible_check_mode

- name: "[Firewall] Ensure the boot unit is running"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    state: started
  when: not ansible_check_mode

- name: "[Firewall] Confirm the host is still reachable"
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: not ansible_check_mode
