---
- name: "[Monitoring] Restart node_exporter"
  ansible.builtin.systemd_service:
    name: "{{ svc_node_exporter }}"
    state: restarted
    daemon_reload: true

- name: "[Monitoring] Restart crowdsec"
  ansible.builtin.systemd_service:
    name: "{{ svc_crowdsec }}"
    state: restarted
    daemon_reload: true

- name: "[Monitoring] Restart alloy"
  community.docker.docker_container:
    name: "{{ alloy_container_name | default('alloy') }}"
    state: started
    restart: true
