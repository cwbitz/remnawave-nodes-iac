crowdsec_blocklist_import_extra_env: {}
alloy_enabled: false
loki_push_url: ""
# Central Prometheus remote-write receiver ("http://<peer>.netbird.selfhosted:9090/api/v1/write").
# Empty = metrics are not pushed (log shipping is unaffected).
prometheus_remote_write_url: ""
alloy_journal_presets: [ssh, security, kernel, services]
alloy_journal_extras: []
