---
# renovate: datasource=docker depName=grafana/alloy
alloy_version: "v1.18.1"

pkg_node_exporter: "prometheus-node-exporter"
pkg_crowdsec: "crowdsec"
pkg_crowdsec_firewall_bouncer: "crowdsec-firewall-bouncer"
svc_node_exporter: "prometheus-node-exporter"
node_exporter_port: 9100
node_exporter_dropin_dir: "/etc/systemd/system/prometheus-node-exporter.service.d"
node_exporter_dropin: "{{ node_exporter_dropin_dir }}/10-overlay-wait.conf"
crowdsec_dropin_dir: "/etc/systemd/system/crowdsec.service.d"
crowdsec_dropin: "{{ crowdsec_dropin_dir }}/10-overlay-wait.conf"
svc_crowdsec: "crowdsec"
svc_crowdsec_firewall_bouncer: "crowdsec-firewall-bouncer"
monitoring_dir: "/opt/monitoring"
alloy_image: "grafana/alloy"
