---
- name: "[CrowdSecWebUI] List the LAPI machine accounts"
  ansible.builtin.command:
    argv: [cscli, machines, list, -o, json]
  register: monitoring_web_ui_machines
  changed_when: false
  failed_when: false
  when: crowdsec_generate_webui_machine_password | bool
  tags: [crowdsec_generate_webui_machine_password]

- name: "[CrowdSecWebUI] Generate the web UI machine password when the vault has none"
  ansible.builtin.include_role:
    name: helpers
    tasks_from: dispatch_secrets
  vars:
    secrets_component: "crowdsec_generate_webui_machine_password"
    secrets_vault_file: "vault.yml"
    secrets_list:
      - {var: "vault_crowdsec_webui_machine_password", type: "hex", length: 32}
  when: crowdsec_generate_webui_machine_password | bool
  tags: [crowdsec_generate_webui_machine_password]

- name: "[CrowdSecWebUI] Register the web UI machine account"
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - >-
        cscli machines add crowdsec-web-ui
        --password "$CROWDSEC_MACHINE_PASSWORD" -f /dev/null
  environment:
    CROWDSEC_MACHINE_PASSWORD: "{{ vault_crowdsec_webui_machine_password }}"
  changed_when: true
  no_log: true
  when:
    - crowdsec_generate_webui_machine_password | bool
    - "'crowdsec-web-ui' not in (monitoring_web_ui_machines.stdout | default(''))"
  tags: [crowdsec_generate_webui_machine_password]

- name: "[CrowdSecWebUI] Point the operator at the shared credential"
  ansible.builtin.debug:
    msg: >-
      Copy vault_crowdsec_webui_machine_password from this host's vault.yml into
      the reading project's vault mapping under the key {{ inventory_hostname }}.
  when: crowdsec_generate_webui_machine_password | bool
  tags: [crowdsec_generate_webui_machine_password]
