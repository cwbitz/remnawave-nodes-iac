---
# ==============================================================================
# Optional VPS host monitoring + host security (roles/monitoring/tasks)
# ==============================================================================
# Installs, on a Debian-family host:
#   * prometheus-node-exporter   — host metrics for central Prometheus/Grafana.
#   * crowdsec                   — log-based detection (SSH brute force, scans)
#                                  from the systemd journal (no rsyslog needed).
#   * crowdsec-firewall-bouncer  — enforces CrowdSec decisions via nftables.
# and joins the host to the NetBird overlay through the shared agent role
# (roles/agent) so a central Prometheus/Alloy reaches it with no public port,
# plus, optionally:
#   * grafana/alloy              — ships host logs to a central Loki.
#
# The Debian packages self-configure: crowdsec enables crowdsecurity/linux +
# crowdsecurity/sshd and reads `ssh.service` from journald; the firewall bouncer
# registers its LAPI key against the local LAPI on install.
#
# The play sets gather_facts: false and this role gathers facts itself (first
# task), so hosts that did NOT opt in (monitoring_enabled false) are skipped
# without any connection being made.
# ==============================================================================

- name: "[Monitoring] Gather facts"
  ansible.builtin.setup:

- name: "[Monitoring] Assert a Debian-family host"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: >-
      monitoring is Debian-family only (apt). Set monitoring_enabled: false on
      unsupported hosts.

- name: "[Monitoring] Select the packages to install"
  ansible.builtin.set_fact:
    monitoring_packages: >-
      {{ ([pkg_node_exporter] if node_exporter_enabled | bool else [])
         + ([pkg_crowdsec, pkg_crowdsec_firewall_bouncer]
            if crowdsec_enabled | bool else []) }}

- name: "[Monitoring] Install the monitoring packages"
  ansible.builtin.apt:
    name: "{{ monitoring_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: monitoring_packages | length > 0

# ------------------------------------------------------------------------------
# Overlay agent (mesh join) + optional log shipper (Docker services)
# ------------------------------------------------------------------------------
- name: "[Monitoring] Join the host to the overlay"
  ansible.builtin.include_role:
    name: agent

- name: "[Monitoring] Assert a central Loki URL when shipping logs"
  ansible.builtin.assert:
    that:
      - (loki_push_url | default('', true) | length) > 0
    fail_msg: >-
      alloy_enabled requires loki_push_url (logs are pushed to Loki over the overlay).
  when: alloy_enabled | bool

- name: "[Monitoring] Assert the log presets are known"
  ansible.builtin.assert:
    that:
      - (alloy_log_presets | default([]) | difference(['ssh', 'security', 'kernel', 'services']) | length) == 0
    fail_msg: >-
      Unknown alloy_log_presets: {{
        alloy_log_presets | default([]) | difference(['ssh', 'security', 'kernel', 'services']) | join(', ')
      }}. Known presets: ssh, security, kernel, services (raw journal matches go in
      alloy_journal_extra_matches).
  when: alloy_enabled | bool

- name: "[Monitoring] Ensure the monitoring stack directory exists"
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The push target is an explicit address, so a re-enrolled central stack can leave
# it stale and every push fails silently in Alloy. Prove reachability here.
- name: "[Monitoring] Assert the central Loki answers"
  ansible.builtin.uri:
    url: "{{ loki_push_url }}/ready"
    status_code: [200, 503]
    timeout: 5
  register: monitoring_loki_probe
  changed_when: false
  failed_when: false
  when:
    - alloy_enabled | bool
    - not ansible_check_mode

- name: "[Monitoring] Fail when the central Loki is unreachable"
  ansible.builtin.assert:
    that:
      - monitoring_loki_probe.status is defined
    fail_msg: >-
      {{ loki_push_url }} did not answer from this host ({{ monitoring_loki_probe.msg | default('no response') }}).
      If the central stack was rebuilt/re-enrolled, its overlay address changed:
      check the current value there (`ip -4 -o addr show wt0`) and update loki_push_url
      (or set it to the peer's netbird name where DNS resolves).
  when:
    - alloy_enabled | bool
    - not ansible_check_mode

- name: "[Monitoring] Render the Alloy configuration"
  ansible.builtin.template:
    src: monitoring/config.alloy.j2
    dest: "{{ monitoring_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0640"
  when: alloy_enabled | bool
  notify: "[Monitoring] Restart alloy"

- name: "[Monitoring] Render the monitoring stack"
  ansible.builtin.template:
    src: monitoring/docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: alloy_enabled | bool

- name: "[Monitoring] Deploy the monitoring stack"
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    remove_orphans: true
  when:
    - alloy_enabled | bool
    - not ansible_check_mode

# ------------------------------------------------------------------------------
# Host exporters
# ------------------------------------------------------------------------------
- name: "[Monitoring] Build the node_exporter listen arguments"
  ansible.builtin.set_fact:
    node_exporter_listen_args:
      - "--web.listen-address={{ overlay_ip }}:{{ node_exporter_port }}"
  when: node_exporter_enabled | bool

- name: "[Monitoring] Configure the node_exporter listen address"
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: >-
      ARGS="{{ node_exporter_listen_args | join(' ') }}"
    owner: root
    group: root
    mode: "0644"
  when: node_exporter_enabled | bool
  notify: "[Monitoring] Restart node_exporter"

# The bound address is created by the NetBird agent container, which Docker
# restarts at boot AFTER systemd has already tried to start this unit. Without a
# wait (and a retry) the first start fails with "cannot assign requested address"
# and Debian's unit does not restart it (see the drop-in template).
- name: "[Monitoring] Ensure the node_exporter drop-in directory exists"
  ansible.builtin.file:
    path: "{{ node_exporter_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_enabled | bool

- name: "[Monitoring] Render the node_exporter overlay-wait drop-in"
  ansible.builtin.template:
    src: monitoring/node_exporter-overlay-wait.conf.j2
    dest: "{{ node_exporter_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when: node_exporter_enabled | bool
  notify: "[Monitoring] Restart node_exporter"

- name: "[Monitoring] Point the CrowdSec metrics listener at the overlay"
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    content: |
      prometheus:
        listen_addr: "{{ overlay_ip }}"
        listen_port: 6060
    owner: root
    group: root
    mode: "0640"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0
  notify: "[Monitoring] Restart crowdsec"

# CrowdSec also binds the overlay address (its metrics listener), so it needs the
# same boot-race guard as node_exporter (see the drop-in template).
- name: "[Monitoring] Ensure the crowdsec drop-in directory exists"
  ansible.builtin.file:
    path: "{{ crowdsec_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0

- name: "[Monitoring] Render the crowdsec overlay-wait drop-in"
  ansible.builtin.template:
    src: monitoring/crowdsec-overlay-wait.conf.j2
    dest: "{{ crowdsec_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0
  notify: "[Monitoring] Restart crowdsec"

- name: "[Monitoring] Select the services to manage"
  ansible.builtin.set_fact:
    monitoring_services: >-
      {{ ([svc_node_exporter] if node_exporter_enabled | bool else [])
         + ([svc_crowdsec, svc_crowdsec_firewall_bouncer]
            if crowdsec_enabled | bool else []) }}

- name: "[Monitoring] Enable and start the monitoring services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ monitoring_services }}"
