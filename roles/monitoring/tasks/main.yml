---
- name: "[Monitoring] Gather facts"
  ansible.builtin.setup:

- name: "[Monitoring] Assert a Debian-family host"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: >-
      monitoring is Debian-family only (apt). Set monitoring_enabled: false on
      unsupported hosts.

- name: "[Monitoring] Assert the overlay is available"
  ansible.builtin.assert:
    that:
      - (overlay_ip | default('', true) | length) > 0
    fail_msg: >-
      node_exporter and CrowdSec bind the NetBird overlay address, so the agent
      must be enabled (netbird_enabled, default true) and joined before the
      monitoring components can start.
  when:
    - (node_exporter_enabled | bool or crowdsec_enabled | bool)
    - not ansible_check_mode

- name: "[Monitoring] Select the packages to install"
  ansible.builtin.set_fact:
    monitoring_packages: >-
      {{ ([pkg_node_exporter] if node_exporter_enabled | bool else [])
         + ([pkg_crowdsec, pkg_crowdsec_firewall_bouncer]
            if crowdsec_enabled | bool else []) }}

- name: "[Monitoring] Install the monitoring packages"
  ansible.builtin.apt:
    name: "{{ monitoring_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: monitoring_packages | length > 0

- name: "[Monitoring] Assert a central Loki URL when shipping logs"
  ansible.builtin.assert:
    that:
      - (loki_push_url | default('', true) | length) > 0
    fail_msg: >-
      alloy_enabled requires loki_push_url (logs are pushed to Loki over the overlay).
  when: alloy_enabled | bool

- name: "[Monitoring] Assert the log presets are known"
  ansible.builtin.assert:
    that:
      - (alloy_journal_presets | default([]) | difference(['ssh', 'security', 'kernel', 'services']) | length) == 0
    fail_msg: >-
      Unknown alloy_journal_presets: {{
        alloy_journal_presets | default([]) | difference(['ssh', 'security', 'kernel', 'services']) | join(', ')
      }}. Known presets: ssh, security, kernel, services (raw journal matches go in
      alloy_journal_extras).
  when: alloy_enabled | bool

- name: "[Monitoring] Ensure the monitoring stack directory exists"
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "[Monitoring] Probe the central Loki"
  ansible.builtin.uri:
    url: "{{ loki_push_url }}/ready"
    status_code: [200, 503]
    timeout: 5
  register: monitoring_loki_probe
  changed_when: false
  failed_when: false
  when:
    - alloy_enabled | bool
    - not ansible_check_mode

- name: "[Monitoring] Warn when the central Loki is unreachable"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ loki_push_url }} did not answer from this host
      ({{ monitoring_loki_probe.msg | default('no response') }}). Alloy keeps
      retrying; prefer a NetBird peer name so the endpoint survives a re-enrolled
      central stack.
  when:
    - alloy_enabled | bool
    - not ansible_check_mode
    - (monitoring_loki_probe.status | default(-1)) not in [200, 503]

- name: "[Monitoring] Render the Alloy configuration"
  ansible.builtin.template:
    src: monitoring/config.alloy.j2
    dest: "{{ monitoring_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0640"
  when: alloy_enabled | bool
  notify: "[Monitoring] Restart alloy"

- name: "[Monitoring] Render the monitoring stack"
  ansible.builtin.template:
    src: monitoring/docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: alloy_enabled | bool

- name: "[Monitoring] Deploy the monitoring stack"
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    remove_orphans: true
  when:
    - alloy_enabled | bool
    - not ansible_check_mode

- name: "[Monitoring] Build the node_exporter listen arguments"
  ansible.builtin.set_fact:
    node_exporter_listen_args:
      - "--web.listen-address={{ overlay_ip }}:{{ node_exporter_port }}"
  when:
    - node_exporter_enabled | bool
    - (overlay_ip | default('', true) | length) > 0

- name: "[Monitoring] Configure the node_exporter listen address"
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: >-
      ARGS="{{ node_exporter_listen_args | join(' ') }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - node_exporter_enabled | bool
    - (overlay_ip | default('', true) | length) > 0
  notify: "[Monitoring] Restart node_exporter"

- name: "[Monitoring] Ensure the node_exporter drop-in directory exists"
  ansible.builtin.file:
    path: "{{ node_exporter_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - node_exporter_enabled | bool
    - (overlay_ip | default('', true) | length) > 0

- name: "[Monitoring] Render the node_exporter overlay-wait drop-in"
  ansible.builtin.template:
    src: monitoring/node_exporter-overlay-wait.conf.j2
    dest: "{{ node_exporter_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - node_exporter_enabled | bool
    - (overlay_ip | default('', true) | length) > 0
  notify: "[Monitoring] Restart node_exporter"

- name: "[Monitoring] Point the CrowdSec metrics listener at the overlay"
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    content: |
      prometheus:
        listen_addr: "{{ overlay_ip }}"
        listen_port: 6060
    owner: root
    group: root
    mode: "0640"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0
  notify: "[Monitoring] Restart crowdsec"

- name: "[Monitoring] Ensure the crowdsec drop-in directory exists"
  ansible.builtin.file:
    path: "{{ crowdsec_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0

- name: "[Monitoring] Render the crowdsec overlay-wait drop-in"
  ansible.builtin.template:
    src: monitoring/crowdsec-overlay-wait.conf.j2
    dest: "{{ crowdsec_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - crowdsec_enabled | bool
    - (overlay_ip | default('')) | length > 0
  notify: "[Monitoring] Restart crowdsec"

- name: "[Monitoring] Select the services to manage"
  ansible.builtin.set_fact:
    monitoring_services: >-
      {{ ([svc_node_exporter] if node_exporter_enabled | bool else [])
         + ([svc_crowdsec, svc_crowdsec_firewall_bouncer]
            if crowdsec_enabled | bool else []) }}

- name: "[Monitoring] Gather the installed service facts"
  ansible.builtin.service_facts:

- name: "[Monitoring] Enable and start the monitoring services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ monitoring_services }}"
  when: (item ~ '.service') in ansible_facts.services

- name: "[Monitoring] Retire the components that are disabled"
  ansible.builtin.include_tasks: cleanup.yml
  when: >-
    not (node_exporter_enabled | default(false) | bool)
    or not (crowdsec_enabled | default(false) | bool)
    or not (alloy_enabled | default(false) | bool)
