---
# ==============================================================================
# SSH hardening - role defaults (roles/sshd/defaults/main.yml)
# ==============================================================================
# Key-only SSH administration for the Node host: password logins are closed
# (`PasswordAuthentication` plus the PAM keyboard-interactive and
# empty-password paths) and root SSH is disabled, applied as a drop-in under
# /etc/ssh/sshd_config.d/ so the provider's and the operator's sshd_config are
# never edited.
#
# Opt-in per host: set `sshd_hardening_enabled: true` in
# inventory/host_vars/<host>/main.yml. It is OFF by default because it removes
# the password path the bootstrap probe falls back to: it is only safe once a
# keyed login survives it — the `ansible` service account, or (for a
# root-administered host) root itself — which is what `make host-bootstrap`
# installs. The role refuses to apply it (and rolls back on any failed
# verification) when that precondition does not hold.

sshd_hardening_enabled: false

# Root SSH policy, INDEPENDENT of the hardening toggle above. A host administered
# only through `root` (no keyed `ansible`/`admin` account) needs
# `prohibit-password` to stay reachable by key once password login is closed;
# `no` disables root SSH entirely. `yes` is intentionally not allowed (password
# authentication is off, so it would only matter if passwords were re-enabled).
# Only rendered while sshd_hardening_enabled is true.
sshd_permit_root_login: "no"
