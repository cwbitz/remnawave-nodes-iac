---
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release manifest
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mint a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID != '' || vars.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID || vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge for a non-major release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs || '[]' }}
        run: |
          set -euo pipefail
          current_major="$(jq -r '."."' .release-please-manifest.json | cut -d. -f1)"
          while IFS=$'\t' read -r number next; do
            if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning title=Manual release merge::Release PR #$number has no parsable version ($next); merge it manually."
              continue
            fi
            next_major="${next%%.*}"
            if (( next_major > current_major )); then
              echo "::notice title=Manual release merge::Release PR #$number bumps the major version to $next; merge it manually."
              continue
            fi
            gh pr merge --auto --squash "$number"
          done < <(jq -r '.[] | [.number, (.body | capture("<summary>(?:[^<]*: )?(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)</summary>").version // "unknown")] | @tsv' <<<"$RELEASE_PRS")
